<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dieta Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dieta">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card2: #232736;
    --text: #e8eaf0;
    --muted: #8b90a0;
    --accent: #4f8ef7;
    --green: #3ecf8e;
    --orange: #ff9f43;
    --red: #ff6b6b;
    --border: #2b2f3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }
  .container { max-width: 680px; margin: 0 auto; padding: 16px; }

  header { text-align: center; padding: 20px 0 8px; }
  header h1 { font-size: 1.4rem; font-weight: 700; }
  header h1 span { color: var(--green); }

  .fase-banner {
    background: linear-gradient(135deg, #16352a, #1a1d27);
    border: 1px solid #2e5c44; border-radius: 12px;
    padding: 12px 16px; margin: 14px 0; font-size: 0.85rem;
  }
  .fase-banner.deficit { background: linear-gradient(135deg, #3a2a1a, #1a1d27); border-color: #6b4a2a; }
  .fase-banner b { color: var(--green); }
  .fase-banner.deficit b { color: var(--orange); }
  .fase-banner .meta { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }

  .streak-banner {
    display: flex; justify-content: center; gap: 20px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px 10px; margin: 14px 0;
  }
  .streak-item { text-align: center; flex: 1; }
  .streak-item .num { font-size: 1.4rem; font-weight: 800; }
  .streak-item .lbl { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .flame { color: var(--orange); }
  .ok { color: var(--green); }
  .warn { color: var(--red); }

  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; padding: 8px 0;
    z-index: 100;
  }
  nav button {
    background: none; border: none; color: var(--muted);
    font-size: 0.72rem; cursor: pointer; padding: 6px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav button .ico { font-size: 1.2rem; }
  nav button.active { color: var(--green); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 12px;
  }
  h2 { font-size: 1.05rem; margin-bottom: 12px; }

  .date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .date-nav button {
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 8px 16px; font-size: 1rem; cursor: pointer;
  }
  .date-nav .dt { font-weight: 700; font-size: 0.95rem; text-align: center; }
  .date-nav .dt .sub { display: block; font-weight: 400; font-size: 0.7rem; color: var(--muted); }

  .hint { font-size: 0.72rem; color: var(--muted); margin: 4px 0 12px; }

  /* ---- balanço do dia ---- */
  .bal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .bal { background: var(--card2); border-radius: 10px; padding: 11px 6px; text-align: center; }
  .bal .n { font-size: 1.05rem; font-weight: 800; }
  .bal .l { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }
  .saldo-box { border-radius: 10px; padding: 12px; margin-top: 10px; text-align: center; border: 1px solid var(--border); }
  .saldo-box.bom { background: #16352a; border-color: var(--green); }
  .saldo-box.fora { background: #3a1f24; border-color: var(--red); }
  .saldo-box .v { font-size: 1.5rem; font-weight: 800; }
  .saldo-box .d { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }

  .macro { margin-top: 12px; }
  .macro-lbl { display: flex; justify-content: space-between; font-size: 0.76rem; margin-bottom: 5px; }
  .macro-lbl .g { color: var(--muted); }
  .bar-bg { height: 9px; border-radius: 5px; background: var(--card2); overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 5px; }
  .bar-meta { position: absolute; top: -3px; width: 2px; height: 15px; background: #fff; opacity: 0.75; }

  .flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .flag {
    font-size: 0.74rem; padding: 6px 11px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--card2); color: var(--muted);
  }
  .flag.on-green { background: #16352a; border-color: var(--green); color: var(--green); }
  .flag.on-orange { background: #3a2a1a; border-color: var(--orange); color: var(--orange); }

  .meal { border-bottom: 1px solid var(--border); padding: 9px 0; }
  .meal:last-child { border-bottom: none; }
  .meal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .meal-nome { font-weight: 600; font-size: 0.85rem; }
  .meal-kcal { font-size: 0.75rem; color: var(--green); font-weight: 700; white-space: nowrap; }
  .meal-macros { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
  .item { font-size: 0.76rem; color: var(--muted); padding: 3px 0 0 10px; display: flex; justify-content: space-between; gap: 8px; }
  .item .ik { white-space: nowrap; }

  .vazio { text-align: center; padding: 22px 10px; color: var(--muted); font-size: 0.85rem; line-height: 1.6; }

  .peso-row { display: flex; align-items: center; gap: 10px; }
  .peso-row input {
    width: 110px; padding: 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 1.1rem; text-align: center; font-weight: 700;
  }
  .peso-row input:focus { outline: none; border-color: var(--green); }
  .peso-row .unit { color: var(--muted); }
  .peso-row .trend { margin-left: auto; font-size: 0.78rem; color: var(--muted); text-align: right; }

  /* ---- calendário ---- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head button { background: var(--card2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 6px 14px; cursor: pointer; }
  .cal-filtros { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .cal-filtros .chip {
    padding: 6px 11px; border-radius: 20px; font-size: 0.75rem; cursor: pointer;
    border: 1px solid var(--border); background: var(--card2); color: var(--muted);
  }
  .cal-filtros .chip.active { background: #3a2a1a; border-color: var(--orange); color: var(--orange); font-weight: 600; }
  .cal-filtros .chip.todos.active { background: #1e2a4a; border-color: var(--accent); color: var(--accent); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-wd { text-align: center; font-size: 0.62rem; color: var(--muted); padding: 4px 0; text-transform: uppercase; }
  .cal-cell {
    aspect-ratio: 1; border-radius: 9px; background: var(--card2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 0.78rem; cursor: pointer; border: 1px solid transparent;
  }
  .cal-cell.empty { background: transparent; cursor: default; }
  .cal-cell.hoje { border-color: var(--accent); }
  .cal-cell.d-green { background: #16352a; color: var(--green); }
  .cal-cell.d-orange { background: #3a2a1a; color: var(--orange); }
  .cal-cell.d-red { background: #3a1f24; color: var(--red); }
  .cal-cell.dim { opacity: 0.18; }
  .cal-cell .ems { font-size: 0.55rem; line-height: 1; margin-top: 2px; min-height: 8px; }
  .cal-cell .val { font-size: 0.5rem; line-height: 1; margin-top: 2px; color: var(--text); opacity: .85; }
  .filtro-count { font-size: 0.78rem; color: var(--orange); margin-top: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; font-size: 0.7rem; color: var(--muted); }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

  /* ---- plano (guia macro) ---- */
  .prep-item { font-size: 0.82rem; color: var(--muted); padding: 5px 0; line-height: 1.5; }
  .prep-item b { color: var(--text); }
  .tl-wrap { position: relative; margin-top: 6px; }
  .timeline { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
  .tl-seg { height: 100%; border-radius: 2px; opacity: 0.4; }
  .tl-seg.done { opacity: 0.75; }
  .tl-seg.atual { opacity: 1; box-shadow: 0 0 0 2px rgba(255,255,255,0.35) inset; }
  .tl-marker { position: absolute; top: -3px; width: 2px; height: 18px; background: #fff; border-radius: 1px; }
  .tl-lbls { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--muted); margin-top: 6px; }
  .bloco-foco { font-size: 0.85rem; line-height: 1.5; }
  .bloco-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .bloco-row:last-of-type { border-bottom: none; }
  .bloco-row.passado { opacity: 0.42; }
  .bloco-row.atual { background: var(--card2); border-radius: 10px; padding: 9px 10px; border-bottom: none; }
  .bloco-cor { width: 4px; align-self: stretch; min-height: 30px; border-radius: 2px; flex-shrink: 0; }
  .bloco-nome { font-size: 0.85rem; font-weight: 600; }
  .bloco-per { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }
  .bloco-metas { text-align: right; font-size: 0.74rem; white-space: nowrap; }
  .bloco-metas .g { color: var(--muted); font-size: 0.7rem; }
  .tag-agora { font-size: 0.6rem; background: var(--accent); color: #fff; border-radius: 5px; padding: 1px 6px; vertical-align: 1px; }
  /* faixa de periodização no calendário */
  .cal-fases { display: flex; gap: 2px; margin-bottom: 8px; height: 20px; }
  .cal-fase { display: flex; align-items: center; justify-content: center; border-radius: 5px; font-size: 0.6rem; color: #0f1117; font-weight: 700; overflow: hidden; white-space: nowrap; }

  /* ---- gráficos ---- */
  canvas { width: 100%; height: 200px; display: block; }
  .chart-note { font-size: 0.73rem; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .chart-leg { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.72rem; color: var(--muted); margin-top: 8px; }
  .chart-leg .sw { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 3px; }
  .periodo { display: flex; gap: 6px; margin-bottom: 12px; }
  .periodo button {
    flex: 1; padding: 8px; border-radius: 10px; cursor: pointer; font-size: 0.78rem;
    border: 1px solid var(--border); background: var(--card2); color: var(--muted);
  }
  .periodo button.active { background: #1e2a4a; border-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* ---- dados ---- */
  .btn {
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 16px; cursor: pointer; font-size: 0.85rem;
    margin-right: 8px; margin-bottom: 8px;
  }
  .btn.primary { background: var(--green); border-color: var(--green); color: #0f1117; font-weight: 700; }
  .btn.danger { border-color: #5c2a2a; color: var(--red); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--card2); border-radius: 10px; padding: 12px; text-align: center; }
  .stat .num { font-size: 1.2rem; font-weight: 800; }
  .stat .lbl { font-size: 0.68rem; color: var(--muted); }
  textarea {
    width: 100%; min-height: 92px; padding: 10px; border-radius: 10px; resize: vertical;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-family: ui-monospace, Consolas, monospace; font-size: 0.75rem; margin-bottom: 10px;
  }
  textarea:focus { outline: none; border-color: var(--green); }
  .msg { font-size: 0.78rem; margin-top: 8px; padding: 9px 11px; border-radius: 9px; line-height: 1.5; }
  .msg.ok { background: #16352a; color: var(--green); }
  .msg.err { background: #3a1f24; color: var(--red); }
</style>
</head>
<body>
<div class="container">
  <header><h1>Dieta <span>Tracker</span> 🥗</h1></header>

</div>
<nav>
  <button data-tab="hoje"><span class="ico">🍽️</span>Dia</button>

  <button data-tab="mes"><span class="ico">📅</span>Mês</button>
  <button data-tab="graficos"><span class="ico">📈</span>Gráficos</button>
  <button data-tab="dados"><span class="ico">⚙️</span>Dados</button>
</nav>

const COR_TIPO = { base: '#6b7bd6', hiper: '#4f8ef7', forca: '#9b7ede', deload: '#8b90a0', polimento: '#ff9f43', manutencao: '#3ecf8e' };

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// Detecção automática a partir dos nomes dos itens do JSON
const KW_FRUTA = ['banana','maca','uva','laranja','mexerica','tangerina','morango','manga','abacaxi','melancia','melao','pera','kiwi','mamao','goiaba','ameixa','pessego','cereja','framboesa','mirtilo','blueberry','amora','caqui','figo','maracuja','acerola','fruta','abacate','ponkan','nectarina'];

  { id: 'fruta',    em: '🍎', lbl: 'Fruta',    cor: 'green'  },
  { id: 'alcool',   em: '🍺', lbl: 'Álcool',   cor: 'orange' },
  { id: 'besteira', em: '🍕', lbl: 'Besteira', cor: 'orange' },
];

let state = load();
let tab = 'hoje';
let selDate = new Date();
let calRef = new Date();
let calFiltro = null;
let periodo = 30;
let importMsg = null;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.dias) return { dias: s.dias || {}, nutri: s.nutri || {} };
  } catch (e) {}
  return { dias: {}, nutri: {} };
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function k(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function pk(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function getDia(key) { return state.dias[key] || null; }
function setDia(key, patch) {
  state.dias[key] = Object.assign({}, state.dias[key] || {}, patch);
  save();
}
function hojeK() { return k(new Date()); }
function faseDe(d) {
  const key = k(d);
  for (const b of BLOCOS) if (key >= b.ini && key <= b.fim) return b;
  return key < BLOCOS[0].ini ? BLOCOS[0] : BLOCOS[BLOCOS.length - 1];
}
// peso de referência do dia, pra converter g/kg em gramas
function pesoRef(key) {
  const doDia = (state.dias[key] || {}).peso;
  if (doDia) return doDia;
  const ps = pesosOrdenados();
  if (ps.length) {
    const ate = ps.filter(p => p.key <= key);
    return (ate.length ? ate[ate.length - 1] : ps[0]).peso;
  }
  return 79;
}
function metasDoDia(key) {
  const b = faseDe(pk(key));
  const peso = pesoRef(key);
  return {
    bloco: b, peso: peso,
    protMin: Math.round(b.protGkg * peso),
    protMax: Math.round((b.protGkg + 0.15) * peso),
    kcalMin: b.kcalMin, kcalMax: b.kcalMax,
  };
}
function weekStart(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function diasAte(keyStr) {
  const ms = pk(keyStr) - new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  return Math.max(0, Math.round(ms / 86400000));
}
function norm(s) {
  return (s || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}
// casa a palavra (aceitando plural) sem pegar prefixo de outra: "bolo" não casa "bolonhesa"
const _reCache = {};
function temPalavra(txt, kw) {
  if (!_reCache[kw]) _reCache[kw] = new RegExp('\\b' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(s|es)?\\b');
  return _reCache[kw].test(txt);
}
function num(a, b) { return typeof a === 'number' && isFinite(a) ? a : b; }
function fmtN(v, dec) { return (Math.round(v * Math.pow(10, dec || 0)) / Math.pow(10, dec || 0)).toLocaleString('pt-BR'); }

// ---------- análise do JSON de nutrição ----------
function detectaFlags(j) {
  const f = { fruta: false, alcool: false, besteira: false };
  for (const m of (j.refeicoes || [])) {
    for (const it of (m.itens || [])) {
      const nome = norm(it.item);
      const kcal = num(it.kcal, 0);
      if (KW_FRUTA.some(w => temPalavra(nome, w))) f.fruta = true;
      // bebida zero/diet/light e itens sem caloria não contam como besteira/álcool
      const zero = kcal <= 5 || /\b(zero|diet|light)\b/.test(nome);
      if (!zero) {
        if (KW_ALCOOL.some(w => temPalavra(nome, w))) f.alcool = true;
        if (KW_BESTEIRA.some(w => temPalavra(nome, w))) f.besteira = true;
      }
    }
  }
  return f;
}


function analisaNutri(j, date) {
  if (!j) return null;
  const r = j.resumo_dia || {};
  const soma = campo => (j.refeicoes || []).reduce((s, m) => s + num((m.total || {})[campo], 0), 0);
  const kcal = num(r.kcal_ingeridas, soma('kcal'));
  const prot = num(r.proteina_g, soma('proteina_g'));
  const carb = num(r.carboidrato_g, soma('carboidrato_g'));
  const gord = num(r.gordura_g, soma('gordura_g'));
  const exer = num(r.kcal_gastas_exercicio, (j.exercicios || []).reduce((s, e) => s + num(e.gasto_calorico_estimado_kcal, 0), 0));
  const tmb = num(r.kcal_gastas_tmb, num((j.usuario || {}).tmb_kcal, 0));
  const gasto = num(r.kcal_gastas_total, tmb + exer);
  const saldo = num(r.saldo_kcal_estimado, kcal - gasto);
  // metas vêm da periodização do plano (não do meta_proteina do JSON)
  const m = metasDoDia(k(date));
  const flags = detectaFlags(j);
  const protOK = prot >= m.protMin;
  const kcalOK = kcal >= m.kcalMin && kcal <= m.kcalMax;
  // fora da meta (proteina ou caloria) pesa mais que o livre planejado
  let status;
  if (!protOK || !kcalOK) status = 'atencao';
  else if (flags.alcool || flags.besteira) status = 'livre';
  else status = 'certo';
  return {
    kcal, prot, carb, gord, exer, tmb, gasto, saldo, flags, status, protOK, kcalOK, bloco: m.bloco,
    metaMin: m.protMin, metaMax: m.protMax, kcalMin: m.kcalMin, kcalMax: m.kcalMax,
    refeicoes: j.refeicoes || [], exercicios: j.exercicios || [], peso: (j.usuario || {}).peso_kg || null,
  };
}
function analiseDe(key) { return analisaNutri(state.nutri[key], pk(key)); }
function serieNutri(dias) {
  let arr = Object.keys(state.nutri).sort().map(key => ({ key, date: pk(key), a: analiseDe(key) })).filter(x => x.a);
  if (dias) {
    const corte = new Date(); corte.setDate(corte.getDate() - dias + 1);
    corte.setHours(0,0,0,0);
    arr = arr.filter(x => x.date >= corte);
  }
  return arr;
}

// ---------- agregados ----------
function semanaStats(refDate) {
  const ini = weekStart(refDate);
  let livres = 0, frutas = 0, comDados = 0, certos = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(ini); d.setDate(ini.getDate() + i);
    const a = analiseDe(k(d));
    if (!a) continue;
    comDados++;
    if (a.flags.alcool || a.flags.besteira) livres++;
    if (a.flags.fruta) frutas++;
    if (a.status === 'certo') certos++;
  }
  return { livres, frutas, comDados, certos };
}
function streakDias() {
  let n = 0;
  const d = new Date();
  const aHoje = analiseDe(k(d));
  if (!aHoje || aHoje.status === 'atencao') d.setDate(d.getDate() - 1);
  while (true) {
    const a = analiseDe(k(d));
    if (a && a.status !== 'atencao') { n++; d.setDate(d.getDate() - 1); }
    else break;
  }
  return n;
}
function pesosOrdenados() {
  return Object.entries(state.dias)
    .filter(([, v]) => typeof v.peso === 'number' && v.peso > 0)
    .map(([key, v]) => ({ key, date: pk(key), peso: v.peso }))
    .sort((a, b) => a.date - b.date);
}
function mediaJanela(pesos, fimDate, dias) {
  const ini = new Date(fimDate); ini.setDate(ini.getDate() - dias + 1);
  const sel = pesos.filter(p => p.date >= ini && p.date <= fimDate);
  if (!sel.length) return null;
  return sel.reduce((s, p) => s + p.peso, 0) / sel.length;
}
function tendencia() {
  const pesos = pesosOrdenados();
  if (pesos.length < 4) return null;
  const hoje = new Date();
  const m1 = mediaJanela(pesos, hoje, 7);
  const fimAnt = new Date(hoje); fimAnt.setDate(hoje.getDate() - 7);
  const m0 = mediaJanela(pesos, fimAnt, 7);
  if (m1 == null || m0 == null) return null;
  return { atual: m1, delta: m1 - m0 };
}

// ---------- import ----------
function importarTexto(txt) {
  let parsed;
  try { parsed = JSON.parse(txt); }
  catch (e) { return { erro: 'JSON inválido: ' + e.message }; }
  return importarObj(parsed);
}
function importarObj(parsed) {
  // backup do próprio app
  if (parsed && parsed.dias && !parsed.data) {
    if (!confirm('Isso é um backup do app. Substituir TODOS os dados atuais?')) return { cancelado: true };
    state = { dias: parsed.dias || {}, nutri: parsed.nutri || {} };
    save();
    return { backup: true, dias: Object.keys(state.dias).length, nutri: Object.keys(state.nutri).length };
  }
  const arr = Array.isArray(parsed) ? parsed : [parsed];
  let n = 0; const erros = [];
  for (const j of arr) {
    if (!j || typeof j !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(j.data || '')) {
      erros.push('registro sem campo "data" no formato AAAA-MM-DD');
      continue;
    }
    if (!Array.isArray(j.refeicoes)) { erros.push(j.data + ': sem lista de refeições'); continue; }
    state.nutri[j.data] = j;
    const peso = (j.usuario || {}).peso_kg;
    if (peso && !(state.dias[j.data] || {}).peso) setDia(j.data, { peso: peso });
    n++;
  }
  save();
  return { n, erros };
}

  bind();

}

function pctBloco(b) {
  const ini = pk(b.ini), fim = pk(b.fim), hoje = new Date();
  if (hoje < ini) return 0;
  if (hoje > fim) return 100;
  return Math.round(100 * (hoje - ini) / (fim - ini || 1));
}
const MES_ABBR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function dm(s) { const d = pk(s); return String(d.getDate()).padStart(2,'0') + '/' + MES_ABBR[d.getMonth()]; }
function fmtPeriodo(b) {
  return b.aberto ? 'a partir de ' + dm(b.ini) : dm(b.ini) + ' – ' + dm(b.fim);
}

// faixa colorida mostrando quais blocos cobrem o mês visível
function faixaFases(y, m) {
  const nDias = new Date(y, m + 1, 0).getDate();
  const partes = [];
  for (const b of BLOCOS) {
    const ini = pk(b.ini), fim = pk(b.fim);
    const d1 = new Date(Math.max(ini, new Date(y, m, 1)));
    const d2 = new Date(Math.min(fim, new Date(y, m, nDias)));
    if (d1 > d2) continue;
    const dias = Math.round((d2 - d1) / 86400000) + 1;
    partes.push({ b, dias });
  }
  if (!partes.length) return '<div class="cal-fase" style="flex:1; background:var(--card2); color:var(--muted)">fora da periodização</div>';
  return partes.map(p =>
    `<div class="cal-fase" style="flex:${p.dias}; background:${COR_TIPO[p.b.tipo]}" title="${p.b.nome}">${p.dias >= 5 ? p.b.nome : ''}</div>`
  ).join('');
}

const CAL_FILTROS = [
  { id: 'fruta',     em: '🍎', lbl: 'Fruta' },

  { id: 'superavit', em: '📈', lbl: 'Superávit' },
];
function casaFiltro(a, filtro) {
  if (!filtro) return true;
  if (!a) return false;
  if (filtro === 'deficit') return a.saldo < 0;
  if (filtro === 'superavit') return a.saldo > 0;
  return !!a.flags[filtro];
}
function corStatus(s) {
  return s === 'certo' ? 'd-green' : s === 'livre' ? 'd-orange' : s === 'atencao' ? 'd-red' : '';
}

// ---------- charts ----------
function chartCtx(id) {
  const c = document.getElementById(id);
  if (!c) return null;
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return null;
  c.width = w * dpr; c.height = h * dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  return { ctx, w, h };
}
function msgVazio(ctx, w, h, msg) {
  ctx.fillStyle = '#8b90a0'; ctx.font = '12px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillText(msg, w / 2, h / 2);
}
function grade(ctx, w, h, pad, yMin, yMax, fmt) {
  ctx.strokeStyle = '#2b2f3e'; ctx.lineWidth = 1;
  ctx.font = '10px Segoe UI'; ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (i / 4) * (yMax - yMin);
    const y = pad.t + (1 - (v - yMin) / (yMax - yMin || 1)) * (h - pad.t - pad.b);
    ctx.strokeStyle = '#2b2f3e';
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#8b90a0';
    ctx.fillText(fmt ? fmt(v) : String(Math.round(v)), pad.l - 4, y + 3);
  }
}
function eixoX(ctx, w, h, pad, datas) {
  if (!datas.length) return;
  ctx.fillStyle = '#8b90a0'; ctx.font = '10px Segoe UI'; ctx.textAlign = 'center';
  const f = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  ctx.fillText(f(datas[0]), pad.l + 14, h - 4);
  if (datas.length > 1) ctx.fillText(f(datas[datas.length - 1]), w - pad.r - 14, h - 4);
}
function faixa(ctx, w, pad, h, yMin, yMax, v1, v2, cor) {
  const Y = v => pad.t + (1 - (v - yMin) / (yMax - yMin || 1)) * (h - pad.t - pad.b);
  const y1 = Y(Math.max(v1, v2)), y2 = Y(Math.min(v1, v2));
  ctx.fillStyle = cor;
  ctx.fillRect(pad.l, y1, w - pad.l - pad.r, y2 - y1);
}

function desenhaGraficos() {
  const s = serieNutri(periodo === 0 ? null : periodo);
  drawKcal(s); drawSaldo(s); drawProt(s); drawMacros(s); drawPeso();
}

function drawKcal(s) {
  const c = chartCtx('ch-kcal'); if (!c) return;
  const { ctx, w, h } = c;
  if (!s.length) return msgVazio(ctx, w, h, 'Importe JSONs para ver o gráfico');
  const pad = { l: 40, r: 10, t: 12, b: 20 };
  const maxV = Math.max(...s.map(x => Math.max(x.a.kcal, x.a.gasto))) * 1.1 || 100;
  grade(ctx, w, h, pad, 0, maxV);
  const bw = (w - pad.l - pad.r) / s.length;
  const Y = v => pad.t + (1 - v / maxV) * (h - pad.t - pad.b);
  s.forEach((x, i) => {
    const bx = pad.l + i * bw + bw * 0.2;
    ctx.fillStyle = '#4f8ef7';
    ctx.fillRect(bx, Y(x.a.kcal), Math.max(1, bw * 0.6), h - pad.b - Y(x.a.kcal));
  });
  ctx.strokeStyle = '#ff9f43'; ctx.lineWidth = 2; ctx.beginPath();
  s.forEach((x, i) => {
    const px = pad.l + i * bw + bw / 2, py = Y(x.a.gasto);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  });
  ctx.stroke(); ctx.lineWidth = 1;
  eixoX(ctx, w, h, pad, s.map(x => x.date));
}

function drawSaldo(s) {
  const c = chartCtx('ch-saldo'); if (!c) return;
  const { ctx, w, h } = c;
  if (!s.length) return msgVazio(ctx, w, h, 'Importe JSONs para ver o gráfico');
  const pad = { l: 40, r: 10, t: 12, b: 20 };
  const vals = s.map(x => x.a.saldo);
  const lim = Math.max(600, Math.max(...vals.map(Math.abs)) * 1.15);
  const yMin = -lim, yMax = lim;
  grade(ctx, w, h, pad, yMin, yMax);
  const Y = v => pad.t + (1 - (v - yMin) / (yMax - yMin)) * (h - pad.t - pad.b);
  const y0 = Y(0);
  ctx.strokeStyle = '#8b90a0'; ctx.beginPath(); ctx.moveTo(pad.l, y0); ctx.lineTo(w - pad.r, y0); ctx.stroke();
  const bw = (w - pad.l - pad.r) / s.length;
  s.forEach((x, i) => {
    const bx = pad.l + i * bw + bw * 0.2;
    const y = Y(x.a.saldo);
    ctx.fillStyle = x.a.saldo < 0 ? '#4f8ef7' : '#ff9f43';
    ctx.fillRect(bx, Math.min(y, y0), Math.max(1, bw * 0.6), Math.abs(y - y0) || 1);
  });
  eixoX(ctx, w, h, pad, s.map(x => x.date));
}

function drawProt(s) {
  const c = chartCtx('ch-prot'); if (!c) return;
  const { ctx, w, h } = c;
  if (!s.length) return msgVazio(ctx, w, h, 'Importe JSONs para ver o gráfico');
  const pad = { l: 40, r: 10, t: 12, b: 20 };
  const metas = s.map(x => x.a.metaMax).filter(Boolean);
  const maxV = Math.max(...s.map(x => x.a.prot), ...(metas.length ? metas : [0])) * 1.15 || 100;
  const ult = s[s.length - 1].a;
  if (ult.metaMin && ult.metaMax) faixa(ctx, w, pad, h, 0, maxV, ult.metaMin, ult.metaMax, 'rgba(62,207,142,0.12)');
  grade(ctx, w, h, pad, 0, maxV);
  const Y = v => pad.t + (1 - v / maxV) * (h - pad.t - pad.b);
  const X = i => s.length === 1 ? (pad.l + w - pad.r) / 2 : pad.l + (i / (s.length - 1)) * (w - pad.l - pad.r);
  ctx.strokeStyle = '#3ecf8e'; ctx.lineWidth = 2; ctx.beginPath();
  s.forEach((x, i) => { const px = X(i), py = Y(x.a.prot); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
  ctx.stroke(); ctx.lineWidth = 1;
  s.forEach((x, i) => {
    ctx.fillStyle = x.a.protOK ? '#3ecf8e' : '#ff6b6b';
    ctx.beginPath(); ctx.arc(X(i), Y(x.a.prot), 3, 0, 7); ctx.fill();
  });
  eixoX(ctx, w, h, pad, s.map(x => x.date));
}

function drawMacros(s) {
  const c = chartCtx('ch-macros'); if (!c) return;
  const { ctx, w, h } = c;
  if (!s.length) return msgVazio(ctx, w, h, 'Importe JSONs para ver o gráfico');
  const pad = { l: 40, r: 10, t: 12, b: 20 };
  const maxV = Math.max(...s.map(x => Math.max(x.a.prot, x.a.carb, x.a.gord))) * 1.15 || 100;
  grade(ctx, w, h, pad, 0, maxV);
  const Y = v => pad.t + (1 - v / maxV) * (h - pad.t - pad.b);
  const X = i => s.length === 1 ? (pad.l + w - pad.r) / 2 : pad.l + (i / (s.length - 1)) * (w - pad.l - pad.r);
  [['prot', '#3ecf8e'], ['carb', '#4f8ef7'], ['gord', '#ff9f43']].forEach(([campo, cor]) => {
    ctx.strokeStyle = cor; ctx.lineWidth = 2; ctx.beginPath();
    s.forEach((x, i) => { const px = X(i), py = Y(x.a[campo]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.stroke();
    if (s.length === 1) { ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(X(0), Y(s[0].a[campo]), 3, 0, 7); ctx.fill(); }
  });
  ctx.lineWidth = 1;
  eixoX(ctx, w, h, pad, s.map(x => x.date));
}

function drawPeso() {
  const c = chartCtx('ch-peso'); if (!c) return;
  const { ctx, w, h } = c;
  let pesos = pesosOrdenados();
  if (periodo !== 0) {
    const corte = new Date(); corte.setDate(corte.getDate() - periodo + 1); corte.setHours(0,0,0,0);
    pesos = pesos.filter(p => p.date >= corte);
  }
  if (pesos.length < 2) return msgVazio(ctx, w, h, 'Registre pelo menos 2 pesagens');
  const pad = { l: 40, r: 10, t: 12, b: 20 };
  const t0 = pesos[0].date.getTime(), t1 = pesos[pesos.length - 1].date.getTime();
  const vals = pesos.map(p => p.peso);
  const yMin = Math.min(...vals) - 0.5, yMax = Math.max(...vals) + 0.5;
  const X = t => pad.l + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * (w - pad.l - pad.r);
  const Y = v => pad.t + (1 - (v - yMin) / (yMax - yMin || 1)) * (h - pad.t - pad.b);
  grade(ctx, w, h, pad, yMin, yMax, v => v.toFixed(1));
  ctx.strokeStyle = '#4f8ef766'; ctx.beginPath();
  pesos.forEach((p, i) => { const x = X(p.date.getTime()), y = Y(p.peso); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  ctx.fillStyle = '#4f8ef7';
  pesos.forEach(p => { ctx.beginPath(); ctx.arc(X(p.date.getTime()), Y(p.peso), 2.5, 0, 7); ctx.fill(); });
  ctx.strokeStyle = '#3ecf8e'; ctx.lineWidth = 2; ctx.beginPath();
  pesos.forEach((p, i) => {
    const m = mediaJanela(pesos, p.date, 7);
    const x = X(p.date.getTime()), y = Y(m);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke(); ctx.lineWidth = 1;
  eixoX(ctx, w, h, pad, pesos.map(p => p.date));
}

// ---------- eventos ----------
function resultadoMsg(res) {
  if (!res || res.cancelado) return null;
  if (res.erro) return { tipo: 'err', txt: '❌ ' + res.erro };
  if (res.backup) return { tipo: 'ok', txt: `✅ Backup restaurado: ${res.dias} dia(s) de peso e ${res.nutri} de nutrição.` };
  const partes = [];
  if (res.n) partes.push(`✅ ${res.n} dia(s) importado(s).`);
  if (res.erros && res.erros.length) partes.push(`⚠️ ${res.erros.length} ignorado(s): ${res.erros.slice(0,3).join('; ')}`);
  if (!partes.length) return { tipo: 'err', txt: '❌ Nada importado — confira o formato do JSON.' };
  return { tipo: res.n ? 'ok' : 'err', txt: partes.join(' ') };
}

  const mn = document.getElementById('m-next');
  if (mn) mn.onclick = () => { calRef.setMonth(calRef.getMonth() + 1); render(); };
  document.querySelectorAll('[data-day]').forEach(el => el.onclick = () => {
    const d = pk(el.dataset.day);
    if (d > new Date()) return;
    selDate = d; tab = 'hoje'; render();
  });

  document.querySelectorAll('[data-per]').forEach(el => el.onclick = () => {
    periodo = +el.dataset.per; render();
  });

  const bc = document.getElementById('btn-colar');
  if (bc) bc.onclick = () => {
    const txt = (document.getElementById('nutri-txt').value || '').trim();
    if (!txt) { importMsg = { tipo: 'err', txt: '❌ Cole o JSON na caixa acima.' }; render(); return; }
    importMsg = resultadoMsg(importarTexto(txt));
    render();
  };
  const ba = document.getElementById('btn-arquivos');
  const fn = document.getElementById('file-nutri');
  if (ba && fn) {
    ba.onclick = () => fn.click();
    fn.onchange = () => {
      const files = [...fn.files];
      if (!files.length) return;
      let n = 0; const erros = [];
      let pendentes = files.length;
      files.forEach(file => {
        const r = new FileReader();
        r.onload = () => {
          const res = importarTexto(r.result);
          if (res.erro) erros.push(file.name + ': ' + res.erro);
          else if (res.backup) n += res.nutri;
          else { n += res.n || 0; (res.erros || []).forEach(e => erros.push(file.name + ': ' + e)); }
          if (--pendentes === 0) { importMsg = resultadoMsg({ n, erros }); render(); }
        };
        r.onerror = () => {
          erros.push(file.name + ': falha ao ler');
          if (--pendentes === 0) { importMsg = resultadoMsg({ n, erros }); render(); }
        };
        r.readAsText(file);
      });
    };
  }
  const be = document.getElementById('btn-export');
  if (be) be.onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dieta-tracker-' + hojeK() + '.json';
    a.click();
  };
  const bl = document.getElementById('btn-limpar');
  if (bl) bl.onclick = () => {
    if (!confirm('Apagar TODOS os dados de nutrição importados? (os pesos são mantidos)')) return;
    state.nutri = {}; save();
    importMsg = { tipo: 'ok', txt: '✅ Dados de nutrição apagados.' };
    render();
  };
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; importMsg = null; render(); });
window.addEventListener('resize', () => { if (tab === 'graficos') desenhaGraficos(); });
render();

// PWA: service worker para funcionar offline
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
